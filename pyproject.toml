[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tox-erp"
version = "1.0.0"
description = "TOX ERP - Arabic First Local-First ERP System"
requires-python = ">=3.8"
dependencies = [
    "Django==4.2",
    "djangorestframework>=3.14,<4",
    "whitenoise>=6.0",
    "gunicorn>=21.0"
]