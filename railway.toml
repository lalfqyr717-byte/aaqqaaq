[build]
builder = "NIXPACKS"

[build.env]
PYTHON_VERSION = "3.11"

[deploy]
healthcheckPath = "/api/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"

[[services]]
name = "web"
command = "cd tox && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn tox.wsgi:application --bind 0.0.0.0:$PORT --workers 4"